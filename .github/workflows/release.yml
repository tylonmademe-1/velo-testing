name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify workspace layout and locate gradlew
        run: |
          echo "=== Current working directory ==="
          pwd
          echo "=== Root directory listing ==="
          ls -la
          if [ -f "./gradlew" ]; then
            echo "Found gradlew in root"
            chmod +x ./gradlew
          else
            echo "Searching for gradlew anywhere in repo..."
            find . -name "gradlew" -ls
            GW_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -n "$GW_PATH" ]; then
              echo "Found gradlew at $GW_PATH"
              chmod +x "$GW_PATH"
            else
              echo "Error: gradlew not found! Generating wrapper..."
              gradle wrapper
              chmod +x ./gradlew
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create debug.keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpvex-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Continuous Pre-Release (on push or manual trigger)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous Release
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
          body: "Automated continuous build of mpvEx including 144Hz support."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
